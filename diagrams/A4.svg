<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<title>UML диаграмма классов Номенклатура остатки и корпоративный учёт</title>
<rect width="100%" height="100%" fill="white"/>
<text x="800.0" y="47.0" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold">UML диаграмма классов Номенклатура остатки и корпоративный учёт</text>
<rect x="45" y="85" width="470" height="195.25" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="280.0" y="109.0" text-anchor="middle" font-family="Arial" font-size="19">«entity»</text>
<text x="280.0" y="133.0" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Tool</text>
<polyline points="45,138 515,138" fill="none" stroke="black" stroke-width="1.6"/>
<text x="57" y="166.0" text-anchor="start" font-family="Arial" font-size="21">+ toolCode: string [1..64]</text>
<text x="57" y="192.25" text-anchor="start" font-family="Arial" font-size="21">+ erpArticle: string</text>
<text x="57" y="218.5" text-anchor="start" font-family="Arial" font-size="21">+ name: string [1..200]</text>
<text x="57" y="244.75" text-anchor="start" font-family="Arial" font-size="21">+ size: string?</text>
<text x="57" y="271.0" text-anchor="start" font-family="Arial" font-size="21">+ type: string?</text>
<rect x="570" y="85" width="470" height="247.75" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="805.0" y="109.0" text-anchor="middle" font-family="Arial" font-size="19">«entity»</text>
<text x="805.0" y="133.0" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">ToolCellMapping</text>
<polyline points="570,138 1040,138" fill="none" stroke="black" stroke-width="1.6"/>
<text x="582" y="166.0" text-anchor="start" font-family="Arial" font-size="21">+ mappingId: UUID</text>
<text x="582" y="192.25" text-anchor="start" font-family="Arial" font-size="21">+ cabinetId: string</text>
<text x="582" y="218.5" text-anchor="start" font-family="Arial" font-size="21">+ cellNumber: string</text>
<text x="582" y="244.75" text-anchor="start" font-family="Arial" font-size="21">+ toolCode: string</text>
<text x="582" y="271.0" text-anchor="start" font-family="Arial" font-size="21">+ erpArticle: string</text>
