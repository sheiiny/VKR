<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1450" viewBox="0 0 2200 1450">
<title>UML трассировка подтверждения и частичного результата</title>
<rect width="100%" height="100%" fill="white"/>
<text x="1100.0" y="47.0" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold">UML трассировка подтверждения и частичного результата</text>
<rect x="30.0" y="60" width="240" height="80" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
