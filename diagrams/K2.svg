<text x="1290.0" y="92.0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">AckHandler</text>
<polyline points="1290.0,140 1290.0,1360" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
<rect x="1550.0" y="60" width="240" height="80" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="1670.0" y="92.0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">ExchangeStore</text>
<polyline points="1670.0,140 1670.0,1360" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
<rect x="1930.0" y="60" width="240" height="80" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="2050.0" y="92.0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">AuditLog</text>
<polyline points="2050.0,140 2050.0,1360" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="340.0" y="189.0" text-anchor="middle" font-family="Arial" font-size="24">1 POST ACK: batchId, eventIds,</text>
<text x="340.0" y="219.0" text-anchor="middle" font-family="Arial" font-size="24">traceId</text>
<polyline points="150.0,227 530.0,227" fill="none" stroke="black" stroke-width="1.6"/>
<polygon points="530.0,227 520.0013767535762,231.58557882672133 520.0013767535762,222.41442117327867" fill="black" stroke="black" stroke-width="1.6"/>
<rect x="525.0" y="227" width="10" height="22" rx="0" fill="#eeeeee" stroke="black" stroke-width="1.6"/>
<text x="720.0" y="283.0" text-anchor="middle" font-family="Arial" font-size="24">2 Проверить events:ack и</text>
<text x="720.0" y="313.0" text-anchor="middle" font-family="Arial" font-size="24">cabinetIds</text>
<polyline points="530.0,321 910.0,321" fill="none" stroke="black" stroke-width="1.6"/>
<polygon points="910.0,321 900.0013767535762,325.5855788267213 900.0013767535762,316.4144211732787" fill="black" stroke="black" stroke-width="1.6"/>
<rect x="905.0" y="321" width="10" height="22" rx="0" fill="#eeeeee" stroke="black" stroke-width="1.6"/>
<text x="910.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="24">3 ApplyAck(payload, clientId)</text>
<polyline points="530.0,385 1290.0,385" fill="none" stroke="black" stroke-width="1.6"/>
<polygon points="1290.0,385 1280.0013767535763,389.5855788267213 1280.0013767535763,380.4144211732787" fill="black" stroke="black" stroke-width="1.6"/>
