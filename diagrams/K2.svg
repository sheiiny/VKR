<text x="1480.0" y="471.0" text-anchor="middle" font-family="Arial" font-size="24">пакету и хеш</text>
<polyline points="1290.0,479 1670.0,479" fill="none" stroke="black" stroke-width="1.6"/>
<polygon points="1670.0,479 1660.0013767535763,483.5855788267213 1660.0013767535763,474.4144211732787" fill="black" stroke="black" stroke-width="1.6"/>
<rect x="1665.0" y="479" width="10" height="22" rx="0" fill="#eeeeee" stroke="black" stroke-width="1.6"/>
<text x="1480.0" y="535.0" text-anchor="middle" font-family="Arial" font-size="24">5 Разделить accepted / rejected</text>
<polyline points="1670.0,543 1290.0,543" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
<polyline points="1299.9986232464237,538.4144211732787 1290.0,543 1299.9986232464237,547.5855788267213" fill="none" stroke="black" stroke-width="1.6"/>
<text x="1480.0" y="599.0" text-anchor="middle" font-family="Arial" font-size="24">6 Транзакционно сохранить</text>
<text x="1480.0" y="629.0" text-anchor="middle" font-family="Arial" font-size="24">ACK и результат</text>
<polyline points="1290.0,637 1670.0,637" fill="none" stroke="black" stroke-width="1.6"/>
<polygon points="1670.0,637 1660.0013767535763,641.5855788267213 1660.0013767535763,632.4144211732787" fill="black" stroke="black" stroke-width="1.6"/>
<rect x="1665.0" y="637" width="10" height="22" rx="0" fill="#eeeeee" stroke="black" stroke-width="1.6"/>
<text x="1480.0" y="693.0" text-anchor="middle" font-family="Arial" font-size="24">7 COMMIT; повтор того же ACK</text>
<text x="1480.0" y="723.0" text-anchor="middle" font-family="Arial" font-size="24">безопасен</text>
<polyline points="1670.0,731 1290.0,731" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
<polyline points="1299.9986232464237,726.4144211732787 1290.0,731 1299.9986232464237,735.5855788267213" fill="none" stroke="black" stroke-width="1.6"/>
<text x="910.0" y="787.0" text-anchor="middle" font-family="Arial" font-size="24">8 AckResponse / 409 ack_conflict</text>
<polyline points="1290.0,795 530.0,795" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
<polyline points="539.9986232464238,790.4144211732787 530.0,795 539.9986232464238,799.5855788267213" fill="none" stroke="black" stroke-width="1.6"/>
<text x="1290.0" y="851.0" text-anchor="middle" font-family="Arial" font-size="24">9 traceId, batchId, eventIds, результат без секрета</text>
<polyline points="530.0,859 2050.0,859" fill="none" stroke="black" stroke-width="1.6"/>
<polygon points="2050.0,859 2040.0013767535763,863.5855788267213 2040.0013767535763,854.4144211732787" fill="black" stroke="black" stroke-width="1.6"/>
<rect x="2045.0" y="859" width="10" height="22" rx="0" fill="#eeeeee" stroke="black" stroke-width="1.6"/>
<text x="340.0" y="915.0" text-anchor="middle" font-family="Arial" font-size="24">10 Ответ с acceptedIds и</text>
<text x="340.0" y="945.0" text-anchor="middle" font-family="Arial" font-size="24">rejectedIds</text>
<polyline points="530.0,953 150.0,953" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
<polyline points="159.99862324642373,948.4144211732787 150.0,953 159.99862324642373,957.5855788267213" fill="none" stroke="black" stroke-width="1.6"/>
<text x="35" y="1432.0" text-anchor="start" font-family="Arial" font-size="24">Сплошная стрелка — вызов; пунктир — возврат; рамка — фрагмент взаимодействия</text>
</svg>