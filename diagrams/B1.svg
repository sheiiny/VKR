<text x="40" y="804.0" text-anchor="start" font-family="Arial" font-size="24">[доступ запрещён]</text>
<text x="340.0" y="843.0" text-anchor="middle" font-family="Arial" font-size="24">Сообщить отказ; ячейка</text>
