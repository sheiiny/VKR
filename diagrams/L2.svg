<text x="1107" y="209.5" text-anchor="start" font-family="Arial" font-size="22">+ asOf: DateTime UTC</text>
<text x="1107" y="237.0" text-anchor="start" font-family="Arial" font-size="22">+ items: StockItem[]</text>
<text x="1107" y="264.5" text-anchor="start" font-family="Arial" font-size="22">+ nextPageToken: string?</text>
<rect x="45" y="490" width="470" height="174.0" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="280.0" y="515.0" text-anchor="middle" font-family="Arial" font-size="20">«DTO»</text>
<text x="280.0" y="539.0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">StockItem</text>
<polyline points="45,543 515,543" fill="none" stroke="black" stroke-width="1.6"/>
<text x="57" y="572.0" text-anchor="start" font-family="Arial" font-size="22">+ cellNumber; article: string</text>
<text x="57" y="599.5" text-anchor="start" font-family="Arial" font-size="22">+ name; type; size: string?</text>
<text x="57" y="627.0" text-anchor="start" font-family="Arial" font-size="22">+ quantity: integer [0..*]?</text>
<text x="57" y="654.5" text-anchor="start" font-family="Arial" font-size="22">+ state: known | unknown</text>
<rect x="570" y="490" width="470" height="174.0" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="805.0" y="515.0" text-anchor="middle" font-family="Arial" font-size="20">«DTO»</text>
<text x="805.0" y="539.0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">AckResponse</text>
