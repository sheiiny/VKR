<text x="523" y="171.0" text-anchor="start" font-family="Arial" font-size="17">0..500</text>
<polyline points="1330,274.0 1330,455 250,455 250,490" fill="none" stroke="black" stroke-width="1.6"/>
<polygon points="1330,274.0 1325.0,284.0 1330.0,294.0 1335.0,284.0" fill="black" stroke="black" stroke-width="1.6"/>
<text x="690" y="447.0" text-anchor="start" font-family="Arial" font-size="19">StockSnapshot 1 — StockItem 0..*</text>
<polygon points="45,820 1537,820 1555,838 1555,910 45,910" fill="white" stroke="black" stroke-width="1.6"/>
<polyline points="1537,820 1537,838 1555,838" fill="none" stroke="black" stroke-width="1.6"/>
<text x="55" y="849.0" text-anchor="start" font-family="Arial" font-size="21">Контракты — проектируемая модель. До реализации согласовать семантику курсора, частичный ACK, источник снимка и правила сверки. Инициатор</text>
<text x="55" y="875.25" text-anchor="start" font-family="Arial" font-size="21">AuthRequest, EventQuery, StockQuery и EventAck — ERP.</text>
