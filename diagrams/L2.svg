<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<title>UML модели событий остатков подтверждений и ошибок</title>
<rect width="100%" height="100%" fill="white"/>
<text x="800.0" y="47.0" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold">UML модели событий остатков подтверждений и ошибок</text>
<rect x="45" y="100" width="470" height="174.0" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="280.0" y="125.0" text-anchor="middle" font-family="Arial" font-size="20">«DTO»</text>
<text x="280.0" y="149.0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">EventBatch</text>
<polyline points="45,153 515,153" fill="none" stroke="black" stroke-width="1.6"/>
