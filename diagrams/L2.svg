<text x="582" y="599.5" text-anchor="start" font-family="Arial" font-size="22">+ rejectedIds: UUID[]</text>
<text x="582" y="627.0" text-anchor="start" font-family="Arial" font-size="22">+ results: EventAckResult[]</text>
<text x="582" y="654.5" text-anchor="start" font-family="Arial" font-size="22">+ traceId: string</text>
<rect x="1095" y="490" width="470" height="184.0" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="1330.0" y="515.0" text-anchor="middle" font-family="Arial" font-size="20">«DTO»</text>
<text x="1330.0" y="539.0" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">ErrorResponse</text>
<polyline points="1095,543 1565,543" fill="none" stroke="black" stroke-width="1.6"/>
<text x="1107" y="572.0" text-anchor="start" font-family="Arial" font-size="22">+ code: string</text>
<text x="1107" y="599.5" text-anchor="start" font-family="Arial" font-size="22">+ message: string</text>
<text x="1107" y="627.0" text-anchor="start" font-family="Arial" font-size="22">+ traceId: string</text>
<polyline points="1095,632.5 1565,632.5" fill="none" stroke="black" stroke-width="1.6"/>
<text x="1107" y="662.5" text-anchor="start" font-family="Arial" font-size="22">400 | 401 | 403 | 409 | 429 | 503</text>
<polyline points="515,185 570,185" fill="none" stroke="black" stroke-width="1.6"/>
