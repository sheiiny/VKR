<text x="57" y="209.5" text-anchor="start" font-family="Arial" font-size="22">+ items: ToolEvent [0..500]</text>
<text x="57" y="237.0" text-anchor="start" font-family="Arial" font-size="22">+ nextCursor: string?</text>
<text x="57" y="264.5" text-anchor="start" font-family="Arial" font-size="22">+ hasMore: boolean</text>
