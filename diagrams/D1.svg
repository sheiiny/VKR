<text x="210.0" y="683.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">E3 Оператор</text>
<text x="52" y="717.9" text-anchor="start" font-family="Arial" font-size="23">Состояние обмена</text>
<text x="52" y="746.65" text-anchor="start" font-family="Arial" font-size="23">Разбор ошибок источника</text>
<rect x="1220" y="650" width="340" height="140" rx="0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="1390.0" y="683.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">E4 Администратор</text>
