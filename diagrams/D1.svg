<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<title>Контекст системы автоматизации учёта движения инструмента</title>
<rect width="100%" height="100%" fill="white"/>
<text x="800.0" y="47.0" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold">Контекст системы автоматизации учёта движения инструмента</text>
<ellipse cx="800.0" cy="440.0" rx="300.0" ry="130.0" fill="white" stroke="black" stroke-width="1.6"/>
<text x="800" y="397.0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">P0 Система обмена</text>
<text x="800" y="427.0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">MATRIX-TM — ERP</text>
<text x="800" y="457.0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Объект автоматизации:</text>
<text x="800" y="487.0" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">отражение выдачи и возврата в учёте</text>
