<text x="1095" y="511.0" text-anchor="start" font-family="Arial" font-size="23">Контур ERP инициирует GET events, GET</text>
<text x="1095" y="539.75" text-anchor="start" font-family="Arial" font-size="23">stock и POST ACK. Серверный адаптер</text>
<text x="1095" y="568.5" text-anchor="start" font-family="Arial" font-size="23">преобразует модели. Он не вызывает</text>
<text x="1095" y="597.25" text-anchor="start" font-family="Arial" font-size="23">ERP.</text>
<text x="1095" y="626.0" text-anchor="start" font-family="Arial" font-size="23">Фактическое наличие принадлежит</text>
<text x="1095" y="654.75" text-anchor="start" font-family="Arial" font-size="23">MATRIX-TM, учётный остаток — ERP.</text>
<text x="45" y="887.0" text-anchor="start" font-family="Arial" font-size="22">Детальные атрибуты, операции, кратности и типы связей приведены на рисунках А.2–А.6</text>
