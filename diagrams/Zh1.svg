<polyline points="159.99862324642373,826.4144211732787 150.0,831 159.99862324642373,835.5855788267213" fill="none" stroke="black" stroke-width="1.6"/>
<polyline points="25,873 2175,873" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
