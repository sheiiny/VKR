<text x="510" y="451.0" text-anchor="start" font-family="Arial" font-size="18">ToolEvent 1 — ExchangeRecord 1</text>
<polygon points="45,825 1537,825 1555,843 1555,910 45,910" fill="white" stroke="black" stroke-width="1.6"/>
<polyline points="1537,825 1537,843 1555,843" fill="none" stroke="black" stroke-width="1.6"/>
<text x="55" y="853.0" text-anchor="start" font-family="Arial" font-size="20">eventId назначается исходной операции один раз. GET не меняет статус available. ACK фиксирует acknowledged. Checkpoint продвигается после COMMIT.</text>
