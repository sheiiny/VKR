<text x="50" y="1042.0" text-anchor="start" font-family="Arial" font-size="24">AS IS — гипотеза для анализа по ТЗ, а не подтверждённое обследование предприятия. Предполагаемая проблема: повторный ручной ввод между фактом шкафа и учётом ERP.</text>
