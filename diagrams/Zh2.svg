<polyline points="159.99862324642373,950.4144211732787 150.0,955 159.99862324642373,959.5855788267213" fill="none" stroke="black" stroke-width="1.6"/>
<polyline points="25,997 2175,997" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
