<polyline points="159.99862324642373,1246.4144211732787 150.0,1251 159.99862324642373,1255.5855788267213" fill="none" stroke="black" stroke-width="1.6"/>
<polyline points="25,423 25,1293 2175,1293 2175,423" fill="none" stroke="black" stroke-width="1.6"/>
<text x="35" y="1432.0" text-anchor="start" font-family="Arial" font-size="24">Сплошная стрелка — вызов; пунктир — возврат; рамка — фрагмент взаимодействия</text>
