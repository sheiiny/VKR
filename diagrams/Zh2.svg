<polyline points="1670.0,891 530.0,891" fill="none" stroke="black" stroke-width="1.6" stroke-dasharray="7 5"/>
<polyline points="539.9986232464238,886.4144211732787 530.0,891 539.9986232464238,895.5855788267213" fill="none" stroke="black" stroke-width="1.6"/>
<text x="340.0" y="947.0" text-anchor="middle" font-family="Arial" font-size="24">10 200 / 409 / 503</text>
